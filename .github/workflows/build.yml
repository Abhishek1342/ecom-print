name: Build InvoicePrinter

"on":
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

jobs:
  # ── Windows Build ────────────────────────────────────────────────────────────
  build-windows:
    name: Build — Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install PyMuPDF Pillow customtkinter tkinterdnd2 pyinstaller pywin32

      - name: Build with PyInstaller
        run: python -m PyInstaller ecom_print.spec

      - name: Rename binary with version suffix
        run: Rename-Item dist\InvoicePrinter.exe InvoicePrinter-windows-x86_64.exe
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoicePrinter-windows
          path: dist/InvoicePrinter-windows-x86_64.exe
          retention-days: 7

  # ── GitHub Release (tag pushes only) ────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: InvoicePrinter-windows
          path: release/

      - name: List release files
        run: ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "InvoicePrinter ${{ github.ref_name }}"
          body: |
            ## InvoicePrinter ${{ github.ref_name }}

            ### Download
            | Platform | File |
            |---|---|
            | 🪟 Windows (x86_64) | `InvoicePrinter-windows-x86_64.exe` |

            ### Usage
            Double-click `InvoicePrinter-windows-x86_64.exe` to launch.

            > 🖨 Supports direct printing to your default Windows printer.
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release/InvoicePrinter-windows-x86_64.exe
